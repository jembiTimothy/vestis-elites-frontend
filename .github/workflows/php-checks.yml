
name: Vestis Elites PHP Validation

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main

jobs:
  php-validation:
    name: PHP Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP syntax
        run: |
          find . -type f -name "*.php" \
            -not -path "./.git/*" \
            -print0 | xargs -0 -n1 php -l
            
